name: Build BCP Converter (Briefcase)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "README.md"
      - "bcp-converter-python-tk.py"
      - ".github/workflows/bcp-converter-briefcase.yml"

permissions:
  contents: write

env:
  FORCE_COLOR: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: "${{ matrix.target }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        target: ["Windows", "macOS", "Linux-Flatpak"]
        include:
          - target: "Windows"
            output-format: "app"
            runs-on: "windows-latest"
            briefcase-args: ""
            briefcase-package-args: "--adhoc-sign"
            poetry-install-args: ""

          - target: "macOS"
            platform: "macOS"
            output-format: "app"
            runs-on: "macos-latest"
            briefcase-args: ""
            briefcase-package-args: "--adhoc-sign"
            poetry-install-args: ""

          - target: "Linux-Flatpak"
            platform: "linux"
            output-format: "flatpak"
            runs-on: "ubuntu-latest"
            briefcase-args: ""
            poetry-install-args: "--only dev --no-root"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller toolchain
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install pyinstaller

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            socat \
            build-essential \
            libgirepository-2.0-dev \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            gir1.2-gtk-3.0 \
            libgtk-3-dev

      - name: Install project dependencies
        run: |
          poetry install ${{ matrix.poetry-install-args }}

      - name: Configure Flatpak sources
        if: runner.os == 'Linux' && matrix.output-format == 'flatpak'
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remotes
          sudo flatpak update --appstream -y

      - name: Briefcase create
        run: |
          poetry run briefcase create \
            ${{ matrix.platform || matrix.target }} \
            ${{ matrix.output-format }} \
            --no-input --log \
            ${{ matrix.briefcase-args }}

      - name: Briefcase build
        run: |
          poetry run briefcase build \
            ${{ matrix.platform || matrix.target }} \
            ${{ matrix.output-format }} \
            --no-input --log \
            ${{ matrix.briefcase-args }}

      - name: Briefcase package
        run: |
          poetry run briefcase package \
            ${{ matrix.platform || matrix.target }} \
            ${{ matrix.output-format }} \
            --update --no-input --log \
            ${{ matrix.briefcase-args }} \
            ${{ matrix.briefcase-package-args }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bcp-converter-${{ matrix.target }}-dist
          path: dist/**
          if-no-files-found: error

      - name: Upload Briefcase logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bcp-converter-${{ matrix.target }}-logs
          path: logs/**
          if-no-files-found: warn

  build-pyinstaller:
    name: "PyInstaller ${{ matrix.target }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "Windows"
            runs-on: "windows-latest"
            archive-name: "bcp-converter-pyinstaller-windows.zip"

          - target: "macOS"
            runs-on: "macos-latest"
            archive-name: "bcp-converter-pyinstaller-macos.zip"
            codesign-command: "codesign --force --deep --sign - dist/bcp-converter.app"

          - target: "Linux"
            runs-on: "ubuntu-latest"
            archive-name: "bcp-converter-pyinstaller-linux.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install poetry

      - name: Install Linux Tk dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Build portable binary with PyInstaller
        run: |
          pyinstaller bcp-converter-python-tk.py \
            --clean \
            --onefile \
            --windowed \
            --name bcp-converter

      - name: Ad-hoc sign macOS app bundle
        if: runner.os == 'macOS'
        run: |
          ${{ matrix.codesign-command }}

      - name: Package PyInstaller output
        env:
          ARCHIVE_NAME: ${{ matrix.archive-name }}
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          dist_dir = pathlib.Path("dist")
          output_dir = pathlib.Path("release-pyinstaller")
          output_dir.mkdir(exist_ok=True)

          archive_path = output_dir / pathlib.Path(__import__("os").environ["ARCHIVE_NAME"])
          entries = sorted(path for path in dist_dir.iterdir() if path.name != archive_path.name)

          if not entries:
              raise SystemExit("PyInstaller did not produce any files in dist/")

          with zipfile.ZipFile(archive_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for entry in entries:
                  if entry.is_dir():
                      for child in entry.rglob("*"):
                          if child.is_file():
                              archive.write(child, child.relative_to(dist_dir))
                  else:
                      archive.write(entry, entry.name)

          print(f"Created {archive_path}")
          PY

      - name: Upload PyInstaller artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bcp-converter-PyInstaller-${{ matrix.target }}
          path: release-pyinstaller/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - build-pyinstaller
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Add pure Python script asset
        run: |
          if [ ! -f "bcp-converter-python-tk.py" ]; then
            echo "Missing bcp-converter-python-tk.py in repository checkout"
            exit 1
          fi
          cp bcp-converter-python-tk.py release-assets/

      - name: Validate required OS artifacts
        run: |
          set -euo pipefail

          required=(
            "bcp-converter-Windows-dist"
            "bcp-converter-macOS-dist"
            "bcp-converter-Linux-Flatpak-dist"
          )

          missing=()

          for folder in "${required[@]}"; do
            if [ ! -d "release-assets/$folder" ]; then
              missing+=("$folder")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## Release Guard Failed"
              echo
              echo "Missing required artifact folders:"
              for folder in "${missing[@]}"; do
                echo "- $folder"
              done
            } >> "$GITHUB_STEP_SUMMARY"

            echo "Missing required artifact folders: ${missing[*]}"
            exit 1
          fi

          if ! find release-assets -type f | grep -q .; then
            {
              echo "## Release Guard Failed"
              echo
              echo "No files were found inside downloaded artifacts."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "No files found in downloaded artifacts."
            exit 1
          fi

      - name: Publish release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BCP Converter ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*
