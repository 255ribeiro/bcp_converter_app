name: Build BCP Converter (Briefcase)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "README.md"
      - ".github/workflows/bcp-converter-briefcase.yml"

permissions:
  contents: write

jobs:
  build:
    name: "${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            gir1.2-gtk-3.0 \
            libgtk-3-dev

      - name: Install project dependencies
        run: poetry install

      - name: Build app with Briefcase
        run: |
          poetry run briefcase create
          poetry run briefcase build
          poetry run briefcase package

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bcp-converter-${{ matrix.os }}-dist
          path: |
            dist/**
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Validate required OS artifacts
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "bcp-converter-ubuntu-latest-dist"
            "bcp-converter-windows-latest-dist"
            "bcp-converter-macos-latest-dist"
          )

          missing=()

          for folder in "${required[@]}"; do
            if [ ! -d "release-assets/$folder" ]; then
              missing+=("$folder")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## Release Guard Failed"
              echo
              echo "Missing required artifact folders:"
              for folder in "${missing[@]}"; do
                echo "- $folder"
              done
            } >> "$GITHUB_STEP_SUMMARY"

            echo "Missing required artifact folders: ${missing[*]}"
            exit 1
          fi

          if ! find release-assets -type f | grep -q .; then
            {
              echo "## Release Guard Failed"
              echo
              echo "No files were found inside downloaded artifacts."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "No files found in downloaded artifacts."
            exit 1
          fi

          {
            echo "## Release Guard Passed"
            echo
            echo "All required OS artifact folders were found:"
            for folder in "${required[@]}"; do
              echo "- $folder"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BCP Converter ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*
