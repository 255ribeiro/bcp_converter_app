name: Build BCP Converter (Briefcase)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "README.md"
      - ".github/workflows/bcp-converter-briefcase.yml"

permissions:
  contents: write

env:
  FORCE_COLOR: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: "${{ matrix.target }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        target: ["Windows", "macOS", "Ubuntu-24.04"]
        include:
          - target: "Windows"
            output-format: "app"
            runs-on: "windows-latest"
            briefcase-package-args: "--adhoc-sign"

          - target: "macOS"
            platform: "macOS"
            output-format: "app"
            runs-on: "macos-latest"
            briefcase-package-args: "--adhoc-sign"

          - target: "Ubuntu-24.04"
            platform: "linux"
            output-format: "system"
            runs-on: "ubuntu-latest"
            briefcase-args: "--target ubuntu:24.04"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install poetry

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            socat \
            build-essential \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            gir1.2-gtk-3.0 \
            libgtk-3-dev

      - name: Install project dependencies
        run: |
          poetry install --only dev --no-root

      - name: Briefcase create
        run: |
          poetry run briefcase create \
            ${{ matrix.platform || matrix.target }} \
            ${{ matrix.output-format }} \
            --no-input --log \
            ${{ matrix.briefcase-args }}

      - name: Briefcase build
        run: |
          poetry run briefcase build \
            ${{ matrix.platform || matrix.target }} \
            ${{ matrix.output-format }} \
            --no-input --log \
            ${{ matrix.briefcase-args }}

      - name: Briefcase package
        run: |
          poetry run briefcase package \
            ${{ matrix.platform || matrix.target }} \
            ${{ matrix.output-format }} \
            --update --no-input --log \
            ${{ matrix.briefcase-args }} \
            ${{ matrix.briefcase-package-args }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bcp-converter-${{ matrix.target }}-dist
          path: dist/**
          if-no-files-found: error

      - name: Upload Briefcase logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bcp-converter-${{ matrix.target }}-logs
          path: logs/**
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Validate required OS artifacts
        run: |
          set -euo pipefail

          required=(
            "bcp-converter-Windows-dist"
            "bcp-converter-macOS-dist"
            "bcp-converter-Ubuntu-24.04-dist"
          )

          missing=()

          for folder in "${required[@]}"; do
            if [ ! -d "release-assets/$folder" ]; then
              missing+=("$folder")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## Release Guard Failed"
              echo
              echo "Missing required artifact folders:"
              for folder in "${missing[@]}"; do
                echo "- $folder"
              done
            } >> "$GITHUB_STEP_SUMMARY"

            echo "Missing required artifact folders: ${missing[*]}"
            exit 1
          fi

          if ! find release-assets -type f | grep -q .; then
            {
              echo "## Release Guard Failed"
              echo
              echo "No files were found inside downloaded artifacts."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "No files found in downloaded artifacts."
            exit 1
          fi

      - name: Publish release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BCP Converter ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*
